app-id: org.garudalinux.firedragon
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.mozilla.firefox.BaseApp
base-version: '25.08'
command: firedragon
finish-args:
  - --allow=devel
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pcsc
  - --socket=cups
  - --require-version=0.11.1
  - --persist=.firedragon
  - --env=DICPATH=/usr/share/hunspell
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-download:rw
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --device=all
  - --talk-name=org.freedesktop.FileManager1
  - --system-talk-name=org.freedesktop.NetworkManager
  - --talk-name=org.a11y.Bus
  - --talk-name=org.gtk.vfs.*
  - --own-name=org.mpris.MediaPlayer2.firefox.*
  - --own-name=org.mozilla.firedragon.*
modules:
  - name: firedragon-x64
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - mkdir -p /app/lib
      - tar -xf firedragon.linux-x64.tar.xz -C /app/lib
    sources:
      - type: file
        url: https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/v13.3.0/downloads/firedragon.linux-x64.tar.xz
        sha256: 2104a6b7abb78083115accd26f2e2df546c30e9590843731dde60ca5889523a5
        x-checker-data:
          is-main-source: true
          type: json
          url: https://gitlab.com/api/v4/projects/75420733/releases/permalink/latest
          version-query: .tag_name
          url-query: '"https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/\(.tag_name)/downloads/firedragon.linux-x64.tar.xz"'
  - name: firedragon-arm64
    buildsystem: simple
    only-arches:
      - aarch64
    build-commands:
      - mkdir -p /app/lib
      - tar -xf firedragon.linux-arm64.tar.xz -C /app/lib
    sources:
      - type: file
        url: https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/v13.3.0/downloads/firedragon.linux-arm64.tar.xz
        sha256: 820055137631933ad6b61eafe3cad6fa7a950358eb055682f792358a6828c3c7
        x-checker-data:
          is-main-source: true
          type: json
          url: https://gitlab.com/api/v4/projects/75420733/releases/permalink/latest
          version-query: .tag_name
          url-query: '"https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/\(.tag_name)/downloads/firedragon.linux-arm64.tar.xz"'
  - name: firedragon
    buildsystem: simple
    build-commands:
      - |
        for file in $(find assets/flatpak/files -type f -printf '%P\n'); do
            sed -e 's/@FLATPAK_ID@/org.garudalinux.firedragon/' -e "s/@VERSION@/$(git describe)/" assets/flatpak/files/"$file" | install -Dm$(stat -c %a assets/flatpak/files/"$file") /dev/stdin /app/"$file"
        done
      - install -Dm644 -t /app/share/applications assets/org.garudalinux.firedragon.desktop
      - install -Dm644 -t /app/share/metainfo assets/org.garudalinux.firedragon.metainfo.xml
      - |
        for size in 16 22 24 32 48 64 128; do
            install -Dm644 -T branding/dr460nized/default${size}.png /app/share/icons/hicolor/${size}x${size}/apps/org.garudalinux.firedragon.png
        done
    sources:
      - type: git
        url: https://gitlab.com/garuda-linux/firedragon/firedragon13.git
        tag: v13.3.0
        commit: df5c5ee304b65b1437b1a1876edf62000a8c55a8
        disable_submodules: true
        x-checker-data:
          is-main-source: true
          type: json
          url: https://gitlab.com/api/v4/projects/75420733/releases/permalink/latest
          version-query: .tag_name
          tag-query: .tag_name
