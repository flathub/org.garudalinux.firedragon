app-id: org.garudalinux.firedragon
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.mozilla.firefox.BaseApp
base-version: '25.08'
command: firedragon
finish-args:
  - --allow=devel
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pcsc
  - --socket=cups
  - --require-version=0.11.1
  - --persist=.firedragon
  - --env=DICPATH=/usr/share/hunspell
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-download:rw
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --device=all
  - --talk-name=org.freedesktop.FileManager1
  - --system-talk-name=org.freedesktop.NetworkManager
  - --talk-name=org.a11y.Bus
  - --talk-name=org.gtk.vfs.*
  - --own-name=org.mpris.MediaPlayer2.firefox.*
  - --own-name=org.mozilla.firedragon.*
modules:
  - name: firedragon
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg
      - mv firedragon /app/lib/
      - install -Dm755 firedragon.sh /app/bin/firedragon
      - install -Dm644 -t /app/lib/firedragon/distribution distribution.ini
      - install -Dm644 -t /app/share/applications org.garudalinux.firedragon.desktop
      - install -Dm644 -t /app/share/metainfo org.garudalinux.firedragon.metainfo.xml
      - |
        for size in 16 32 48 64 128; do
            install -Dm644 -T "/app/lib/firedragon/browser/chrome/icons/default/default${size}.png" "/app/share/icons/hicolor/${size}x${size}/apps/org.garudalinux.firedragon.png"
        done
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/v13.0.0-rc.23/downloads/firedragon.linux-x64.tar.xz
        sha256: afc883241fa71071abee69d2dd7467e76fb3fcbc2844248e448ed0ba836d7a3c
        strip-components: 0
        x-checker-data:
          is-main-source: true
          type: json
          url: https://gitlab.com/api/v4/projects/75420733/releases/permalink/latest
          version-query: .tag_name
          url-query: '"https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/\($version)/downloads/firedragon.linux-x64.tar.xz"'
      - type: archive
        only-arches:
          - aarch64
        url: https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/v13.0.0-rc.23/downloads/firedragon.linux-arm64.tar.xz
        sha256: cc23be64cd36293deb0781937fbf8dfc808efb846df1e5f7a0e1b95b1d4ce1cd
        strip-components: 0
        x-checker-data:
          is-main-source: true
          type: json
          url: https://gitlab.com/api/v4/projects/75420733/releases/permalink/latest
          version-query: .tag_name
          url-query: '"https://gitlab.com/garuda-linux/firedragon/firedragon13/-/releases/\($version)/downloads/firedragon.linux-arm64.tar.xz"'
      - type: file
        dest-filename: org.garudalinux.firedragon.desktop
        url: https://gitlab.com/garuda-linux/firedragon/firedragon13/-/raw/v13.0.0-rc.23/assets/org.garudalinux.firedragon.desktop
        sha256: 807c813a037f29c391416345214d3e7acb1f7f61f391ee04ca8db55c6470c5a3
        x-checker-data:
          type: json
          url: https://gitlab.com/api/v4/projects/75420733/releases/permalink/latest
          version-query: .tag_name
          url-query: '"https://gitlab.com/garuda-linux/firedragon/firedragon13/-/raw/\($version)/assets/org.garudalinux.firedragon.desktop"'
      - type: file
        dest-filename: org.garudalinux.firedragon.metainfo.xml
        url: https://gitlab.com/garuda-linux/firedragon/firedragon13/-/raw/v13.0.0-rc.23/assets/org.garudalinux.firedragon.metainfo.xml
        sha256: 2b7708cbe6112871509a26b128d823d1cef210a971d4a8032c75a7e57ff7beee
        x-checker-data:
          type: json
          url: https://gitlab.com/api/v4/projects/75420733/releases/permalink/latest
